<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Unit Price"><meta name="theme-color" content="#F4F1EA"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Grocery Unit Price Compare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column; every screen fills the viewport, scan screens pin Retake/Done and the Fix it row to the same spot.
   Tokens follow the Grocery Unit Price Compare design canvas (single light look). */
:root {
  --paper: #F4F1EA; --panel: #FBF9F4; --ink: #15161A; --muted: #5B5F66; --body2: #3A3E46;
  --rule: #D9D4C8; --rule2: #CFC9BB; --stripe1: #E6E1D4; --stripe2: #EDE9DE; --cam: #0E0F12;
  --d: #0B6B2D; --d-ink: #F2E91A; --d-tint: #E1F0E3;
  --f: #A97A00; --f-ink: #15161A; --f-tint: #F3EAD0;
  --display: 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
  --body: 'Trebuchet MS', Verdana, sans-serif;
  --mono: ui-monospace, Menlo, monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--f); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.pl { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.pl20 { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.disp { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.stripes { background: repeating-linear-gradient(135deg, var(--stripe1) 0, var(--stripe1) 12px, var(--stripe2) 12px, var(--stripe2) 24px); }
img.ph { display: block; object-fit: cover; background: var(--stripe1); }
.gcard img.ph { min-height: 0; }
.tile img.ph { width: 100%; }
.stripes.sm { background: repeating-linear-gradient(135deg, var(--stripe1) 0, var(--stripe1) 10px, var(--stripe2) 10px, var(--stripe2) 20px); }
.chip { flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; font: 600 14px var(--mono); display: inline-flex; align-items: center; justify-content: center; }
.chip.sm { width: 24px; height: 24px; border-radius: 7px; font-size: 13px; }
.chip.D { background: var(--d); color: var(--d-ink); }
.chip.F { background: var(--f); color: var(--f-ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* round icon buttons and pills */
.xbtn { flex-shrink: 0; width: 48px; height: 48px; margin-left: -8px; border-radius: 50%; border: 0; padding: 0; background: rgba(21,22,26,0.08); display: flex; align-items: center; justify-content: center; }
.back { flex-shrink: 0; width: 48px; height: 48px; margin-left: -8px; border: 0; padding: 0; background: none; display: flex; align-items: center; justify-content: center; }
.pill { flex: 1; height: 52px; border-radius: 26px; border: 2px solid var(--ink); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; padding: 0; }
.pill.solid { background: var(--ink); color: var(--paper); }
.pill:disabled { border-color: var(--rule); background: var(--rule); color: var(--muted); cursor: default; }
.fixrow { flex-shrink: 0; align-self: center; height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; color: var(--muted); text-decoration: underline; border: 0; background: none; }
.fixrow[aria-hidden="true"] { visibility: hidden; }

/* home */
#s-home { padding-block: 56px; }
.home-row { flex: 1; display: flex; align-items: stretch; }
.gtab { align-self: center; flex-shrink: 0; width: calc(44px + env(safe-area-inset-left, 0px)); padding-left: env(safe-area-inset-left, 0px); height: 168px; background: var(--stripe1); border: 0; border-radius: 0 22px 22px 0; display: flex; align-items: center; justify-content: center; }
.home-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.shutter { width: 176px; height: 176px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 12px rgba(21,22,26,0.06); cursor: pointer; }
.home-label { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
.home-note { height: 40px; font-size: 14px; color: var(--muted); text-align: center; max-width: 260px; }

/* scan screens */
.scan { padding-top: 8px; padding-bottom: 12px; gap: 12px; }
.topbar { flex-shrink: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar h1 { margin: 0; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.table { flex-shrink: 0; display: flex; flex-direction: column; border-top: 1.5px solid var(--ink); }
.trow { flex-shrink: 0; height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.trow.tall { height: 59px; }
.trow > .k { font-size: 14px; color: var(--muted); flex-shrink: 0; }
.trow > .v { font-size: 18px; font-weight: 600; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow > .v.num { font-family: var(--mono); }
.trow > .v.big { font-family: var(--mono); font-size: 20px; }
.trow > .v.none { color: var(--muted); font-weight: 400; }
.storev { display: flex; align-items: center; gap: 8px; }
.pricev { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 0; }
.pricev .sub { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.itemv { border: 0; background: none; padding: 0; height: 26px; display: flex; align-items: center; gap: 2px; font-size: 18px; font-weight: 600; min-width: 0; }
.itemv span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--rule2); text-underline-offset: 3px; }
.spacer17 { height: 17px; flex-shrink: 0; }
.sk { display: inline-block; height: 22px; border-radius: 6px; background: var(--stripe1); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.verdict { flex-shrink: 0; height: 96px; border-radius: 18px; padding: 10px 16px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.verdict .t { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.verdict .s { font-size: 15px; color: var(--body2); }
.verdict.D { border: 3px solid var(--d); background: var(--d-tint); }
.verdict.F { border: 3px solid var(--f); background: var(--f-tint); }
.verdict.even { border: 3px solid var(--rule2); background: var(--panel); }
.verdict.dash { border: 2px dashed var(--muted); background: var(--panel); flex-direction: row; align-items: flex-start; gap: 12px; }
.verdict.dash > div { display: flex; flex-direction: column; gap: 4px; }
.verdict.skel { background: var(--stripe1); animation: pulse 1.4s ease-in-out infinite; }
.btnrow { margin-top: auto; flex-shrink: 0; display: flex; gap: 12px; }

/* which item */
.readbox { flex-shrink: 0; height: 56px; border-radius: 14px; border: 2px dashed var(--muted); background: var(--panel); padding: 0 14px; display: flex; align-items: center; gap: 10px; }
.readbox .m { font: 600 16px var(--mono); }
.readbox .note { flex: 1; min-width: 0; text-align: right; font-size: 13px; color: var(--muted); }
.matches { flex-shrink: 0; height: 198px; display: flex; flex-direction: column; gap: 8px; }
.matches > .lbl { font-size: 14px; color: var(--muted); height: 18px; line-height: 18px; }
.mrow { flex-shrink: 0; height: 52px; border-radius: 14px; border: 2px solid var(--rule); background: var(--panel); padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
.mrow .n { display: block; font-size: 16px; font-weight: 600; line-height: 20px; }
.mrow .c { display: block; font-size: 13px; line-height: 16px; color: var(--muted); }
.nomatch { flex: 1; border-radius: 14px; border: 2px dashed var(--muted); background: var(--panel); padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.browse { flex-shrink: 0; height: 48px; border-radius: 24px; border: 2px solid var(--rule); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; }

/* gallery and categories */
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
#s-gallery { padding-top: 20px; padding-bottom: 24px; gap: 20px; }
.ghead { flex-shrink: 0; display: flex; align-items: center; gap: 4px; min-height: 48px; }
.ghead .pick { font-size: 15px; color: var(--muted); }
.ggrid { flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.gcard { height: 160px; border-radius: 18px; border: 2px solid var(--rule); background: var(--panel); overflow: hidden; display: flex; flex-direction: column; padding: 0; text-align: left; }
.gcard .ph { flex: 1; width: 100%; }
.gcard .lb { flex-shrink: 0; width: 100%; height: 50px; padding: 0 12px; border-top: 2px solid var(--rule); display: flex; align-items: center; font-size: 15px; line-height: 18px; font-weight: 600; }
.backup { flex-shrink: 0; display: flex; justify-content: center; gap: 8px; }
#s-cat, #s-detail { padding-top: 12px; padding-bottom: 16px; gap: 12px; }
.chead { flex-shrink: 0; min-height: 56px; display: flex; align-items: center; gap: 4px; }
.chead h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 28px; letter-spacing: -0.02em; white-space: pre-line; }
.cgrid { flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 151px; gap: 12px; }
.tile { border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); text-align: left; min-width: 0; }
.tile .ph { height: 56px; border-radius: 10px; flex-shrink: 0; }
.tile .nm { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tile .nm b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .nm span { font-size: 13px; color: var(--muted); }
.tile .pr { display: flex; align-items: center; gap: 8px; }
.tile .pr .mono { font-size: 14px; font-weight: 600; white-space: nowrap; }
.tile.both-D { border: 3px solid var(--d); }
.tile.both-F { border: 3px solid var(--f); }
.tile.both-even { border: 3px solid var(--rule2); }
.tile.one-D { border: 3px dotted var(--d); }
.tile.one-F { border: 3px dotted var(--f); }
.tile.none { border: 2px dashed var(--muted); padding: 9px; background: var(--paper); }

/* detail */
#s-detail .chead h1 { font-size: 30px; line-height: 34px; white-space: normal; }
.dverdict { flex-shrink: 0; border-radius: 18px; padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; }
.dverdict .t { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.dverdict .s { font-size: 15px; color: var(--body2); }
.dverdict.D { background: var(--d-tint); } .dverdict.F { background: var(--f-tint); }
.dverdict.even { background: var(--panel); border: 2px solid var(--rule2); }
.dverdict.dash { border: 2px dashed var(--muted); background: var(--paper); }
.dgrid { flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dcard { border-radius: 18px; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 2px solid var(--rule2); min-width: 0; }
.dcard.win-D { border: 3px solid var(--d); padding: 14px; } .dcard.win-F { border: 3px solid var(--f); padding: 14px; }
.dcard.empty { border: 2px dashed var(--muted); background: var(--paper); }
.dcard .st { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.dcard .f { display: flex; flex-direction: column; gap: 2px; }
.dcard .k { font-size: 13px; color: var(--muted); }
.dcard .up { font: 600 24px var(--mono); white-space: nowrap; height: 32px; line-height: 32px; }
.dcard .up small { font-size: 13px; font-weight: 500; }
.dcard .noup { font-size: 18px; font-weight: 600; color: var(--muted); height: 32px; line-height: 32px; }
.dcard .shelf { font: 500 16px var(--mono); }
.dcard .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.dcard .when { font-size: 13px; color: var(--muted); height: 16px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rescan { height: 44px; border-radius: 22px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
.rescan.solid { background: var(--ink); color: var(--paper); border: 0; }

/* sheets (Fix it, Restore) */
.scrim { position: absolute; inset: 0; background: rgba(21,22,26,0.55); }
.sheet { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: var(--paper); border-radius: 24px 24px 0 0; padding-top: 10px; padding-bottom: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* Safari tab on an iPhone 8 leaves ~513px for the sheet, less with the keyboard up: the sheet scrolls and Cancel/Save stay pinned */
.sheet.split { overflow: hidden; }
.sbody { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
.sheet.split > .btnrow { margin-top: 0; }
.grab { align-self: center; flex-shrink: 0; width: 40px; height: 5px; border-radius: 3px; background: var(--rule); }
.shead { flex-shrink: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.shead h1 { margin: 0; font-size: 22px; }
.ilink { min-width: 0; height: 44px; display: flex; align-items: center; gap: 2px; color: var(--muted); border: 0; background: none; padding: 0; }
.ilink span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; font-weight: 600; text-decoration: underline; }
.fgroup { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
.fgroup > .lbl { font-size: 14px; color: var(--muted); height: 18px; line-height: 18px; }
.seg2 { display: flex; gap: 10px; }
.storebtn { flex: 1; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; border: 2px solid var(--rule); background: transparent; color: var(--muted); padding: 0; }
.storebtn[aria-pressed="true"].D { border-color: var(--d); background: var(--d-tint); color: var(--ink); }
.storebtn[aria-pressed="true"].F { border-color: var(--f); background: var(--f-tint); color: var(--ink); }
.hint { height: 34px; flex-shrink: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 17px; color: var(--muted); overflow: hidden; }
.hint.tall { height: 44px; }
.hint.warn { color: var(--ink); }
.hint.warn.tall { align-items: center; }
.hint > span { flex: 1; min-width: 0; }
.hint > svg { flex: none; margin-top: 1px; }
.usebtn { flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid var(--ink); background: transparent; font-size: 14px; font-weight: 600; }
.stepbtn { flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; border: 2px solid var(--rule); background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 0; }
.field { flex: 1; min-width: 0; height: 56px; border-radius: 14px; border: 2px solid var(--rule); background: var(--panel); text-align: center; font: 600 24px var(--mono); color: var(--ink); padding: 0 8px; -webkit-appearance: none; appearance: none; }
.field:focus { outline: none; border-color: var(--ink); }
.field::placeholder { color: var(--muted); opacity: 1; }
.field.bad { border: 2px solid var(--ink); }
.field.empty { border: 2px dashed var(--muted); }
.qtyrow { flex-shrink: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; }
.qty { display: flex; gap: 8px; }
.qty button { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--rule); background: transparent; font: 600 16px var(--mono); padding: 0; }
.qty button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.units { flex-shrink: 0; display: flex; height: 56px; border-radius: 14px; border: 2px solid var(--rule); overflow: hidden; background: var(--panel); }
.units button { width: 44px; height: 52px; border: 0; background: transparent; font: 600 16px var(--mono); padding: 0; }
.units button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.restore-ta { flex-shrink: 0; width: 100%; height: 180px; border-radius: 14px; border: 2px solid var(--rule); background: var(--panel); padding: 10px; font: 13px/1.4 var(--mono); resize: none; }
#log { display: none; }
</style>

      : s.detectedStore === 'D' ? 'Yellow band and green arrow seen on the tag.' : 'No yellow band or green arrow seen, so Farm Boy.');

    var pHint, pWarn = false;
    if (price == null) { pWarn = true; pHint = s.r && s.r.partialPrice ? 'Price cut off at the photo edge (read ' + s.r.partialPrice + '). Type it from the tag.' : 'No price read. Type it from the tag.'; }
    else if (draft.qty > 1) pHint = draft.qty + ' for ' + money(price) + ' is ' + money(price / draft.qty) + ' each. We store the price for one.';
    else if (isD && s.snappedFrom && price === s.total && !draft.storeTouched) { pWarn = true; pHint = 'Read ' + s.snappedFrom + ". Dollarama prices are in quarters, so it's now " + money(price) + '.'; }
    else if (isD) { pWarn = !quarter; pHint = 'Dollarama prices end in .00, .25, .50 or .75.'; }
    else pHint = 'Tap the price to type it. + and \u2212 move 10\u00a2.';
    hintKids($('fxPriceHint'), pHint, pWarn);
    $('fxPrice').className = 'field' + (price == null ? ' empty' : '');

    var sHint, sWarn = false, sizeCls = '', useBtn = null, ls = lastSize(draft.item), same = s.size && sz && sz.value === s.size.value && sz.unit === s.size.unit;
    if (!String(draft.sizeVal).trim()) {
      sWarn = true; sizeCls = ' empty';
      sHint = s.r && /paper/.test(s.r.kind || '') ? 'No size on this Special! sign. Check the package.' : 'No size read. Type it from the tag or package.';
    } else if (!draft.unit) {
      sWarn = true; sizeCls = ' bad';
      sHint = 'Read \u201c' + draft.sizeVal + '\u201d, which isn\u2019t a size.' + (ls ? ' Last scan was ' + sizeText(ls) + '.' : ' Pick g, kg, ml or L.');
    } else if (same && s.flags.indexOf('fixedsize') >= 0) {
      sWarn = true; sHint = 'Read \u201c' + s.sizeRaw + '\u201d roughly and corrected to ' + sizeText(s.size) + '. Check it against the tag.';
    } else if (same && s.flags.indexOf('checksize') >= 0) {
      sWarn = true; sHint = 'Size read only once, or the reads disagreed. Check it against the tag.';
    } else sHint = same ? 'Read \u201c' + sizeText(s.size) + '\u201d from the tag.' : 'Typed by you.';
    if (sWarn && ls && !(sz && sz.value === ls.value && sz.unit === ls.unit)) {
      useBtn = h('button', { class: 'usebtn', type: 'button', text: 'Use ' + sizeText(ls), onclick: function () { draft.sizeVal = String(ls.value); draft.unit = ls.unit; renderFix(); } });
    }
    hintKids($('fxSizeHint'), sHint, sWarn, useBtn);
    $('fxSize').className = 'field' + sizeCls;
    $('fxSave').disabled = !(price != null && price > 0 && sz && draft.item);
  }
  function saveFix() {
    var p = parseMoney(draft.priceText), sz = draftSize();
    if (p == null || !sz || !draft.item) return;
    scan.store = draft.store; scan.total = p; scan.qty = draft.qty; scan.size = sz; scan.item = draft.item;
    closeFix(); renderScan();
  }
  $('fixScrim').addEventListener('click', closeFix);
  /* the decimal keypad has no Return key: a tap anywhere off the field closes it, and a focused field scrolls into view */
  $('fixSheet').addEventListener('touchstart', function (e) { var a = document.activeElement; if (a && a.tagName === 'INPUT' && e.target !== a) a.blur(); }, { passive: true });
  $('fixSheet').addEventListener('focusin', function (e) { if (e.target.tagName === 'INPUT') setTimeout(function () { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 300); });

  /* ---------- backup ---------- */
  function copyBackup() {
    var txt = JSON.stringify({ v: 1, prices: prices, matchlog: loadJSON('grocery.matchlog.v1', []) });
    var b = $('copyBackup');
    var done = function () { b.textContent = 'Backup copied'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { openRestore(txt); });
    else openRestore(txt);
  }
  function openRestore(prefill) {
    var msg = h('div', { class: 'hint', style: 'height:auto' }, [h('span', { text: prefill ? 'Copying was blocked. Select this text and copy it to keep a backup.' : 'Paste a backup you copied earlier. It replaces the prices and item picks on this phone.' })]);
    var ta = h('textarea', { class: 'restore-ta', id: 'restoreText', 'aria-label': 'Backup text', spellcheck: 'false' });
    if (typeof prefill === 'string') ta.value = prefill;
    fill('restoreSheet', [
      h('div', { class: 'grab', 'aria-hidden': 'true' }),
      h('div', { class: 'shead' }, [h('h1', { class: 'disp', text: prefill ? 'Backup' : 'Restore' })]),
      msg, ta,
      h('div', { class: 'btnrow' }, [
        h('button', { class: 'pill', type: 'button', text: prefill ? 'Close' : 'Cancel', onclick: function () { $('restore').hidden = true; } }),
        prefill ? null : h('button', { class: 'pill solid', type: 'button', text: 'Restore', onclick: function () {
          try {
            var d = JSON.parse(ta.value);
            if (!d || typeof d.prices !== 'object') throw new Error('no prices');
            prices = d.prices; saveJSON(PRICES_KEY, prices);
            if (Array.isArray(d.matchlog)) saveJSON('grocery.matchlog.v1', d.matchlog);
            $('restore').hidden = true; openGallery();
          } catch (err) { msg.firstChild.textContent = "That text isn't a backup from this app. Copy the whole backup and paste it again."; msg.className = 'hint warn'; }
        } })
      ])
    ]);
    $('restore').hidden = false;
    if (typeof prefill === 'string') { ta.focus(); ta.select(); }
  }
  $('restoreScrim').addEventListener('click', function () { $('restore').hidden = true; });

  show('s-home');

})();
</script>
